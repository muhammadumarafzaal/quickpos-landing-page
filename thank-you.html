<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Thank You | QuickPOS</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .thank-you-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;

        .thank-you-card h1 {
            font-size: 2.5rem;

            font-weight: 800;
        }
        .thank-you-card p {
            color: var(--text-muted);

    <div class="thank-you-wrapper">
        <div class="thank-you-card">
